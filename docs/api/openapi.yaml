    post:
      tags: [Correspondence]
      operationId: sendStudentInvitation
      summary: Create a scoped evaluator assignment and queue its invitation email
      description: Requires exactly one active placement and applicable active cycle, a published competency version, and an active evaluator. Ambiguous placement/cycle and missing master data are rejected; no defaults are created.
      x-permissions: [campaigns.send]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [studentId, competencySetId, recipientEmail]
              properties:
                studentId: { type: string }
                competencySetId: { type: string }
                recipientEmail: { type: string, format: email }
                evaluatorName: { type: string }
                deadlineDays: { type: integer, minimum: 1, maximum: 365 }
                subject: { type: string }
                notes: { type: string }
      responses:
        '202':
          description: Invitation delivery queued (not yet confirmed as sent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueuedDelivery'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
