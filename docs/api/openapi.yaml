openapi: 3.1.0
info:
  title: Internship Transcript System V2 API
  version: 0.2.0
  summary: Target contract for internship evaluation, correspondence, and transcript generation
  description: |
    Canonical target contract for V2. This specification is derived from observed legacy workflows
    but intentionally replaces legacy /api/v1 shapes, unauthenticated CRUD, mutable templates,
    and synchronous email/PDF behavior.

    Unresolved organization policies remain marked TBD in descriptions and acceptance criteria.
    No Production credential belongs in this file.
  contact:
    name: Internship Transcript System Owner
  license:
    name: Proprietary / TBD
    identifier: LicenseRef-Proprietary
servers:
  - url: https://{apiHost}/api/v2
    description: Production placeholder
    variables:
      apiHost:
        default: api.example.invalid
        description: Inject the approved Production API hostname
tags:
  - name: Health
    description: Process liveness and dependency readiness
  - name: Auth
    description: Internal identity, session, and external invitation exchange
  - name: Academic
    description: School, Program, Course, and academic term master data
  - name: Students
    description: Student records and bulk import
  - name: Internship
    description: Organizations, evaluators, and placements
  - name: Competencies
    description: Versioned competency sets and scoring rules
  - name: Evaluations
    description: Cycles, assignments, Drafts, submit, and immutable final results
  - name: Correspondence
    description: Versioned email templates, campaigns, and delivery tracking
  - name: System Settings
    description: System-admin-only runtime integration settings
  - name: Documents
    description: Versioned document templates, PDF jobs, and private downloads
  - name: Reports
    description: Scoped dashboards and asynchronous exports
  - name: Audit
    description: Immutable scoped audit-event access
security:
  - cookieAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '429':
          description: Health checks are rate limited
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check required dependency readiness
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '429':
          description: Health checks are rate limited
  /auth/login:
    get:
      tags: [Auth]
      operationId: startInternalLogin
      summary: Start approved internal OIDC login
      description: Provider details remain TBD until MFU OIDC configuration is approved.
      security: []
      responses:
        '302':
          description: Redirect to approved OIDC provider
        '429':
          description: Login attempts are rate limited
        '503':
          description: OIDC provider is unavailable or not configured
  /auth/callback:
    get:
      tags: [Auth]
      operationId: finishInternalLogin
      summary: Validate the OIDC callback and establish a scoped session
      security: []
      responses:
        '302':
          description: Session established and redirected to the web application
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentSession
      summary: Return current user and active scoped roles
      responses:
        '200':
          description: Current authenticated identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Rotate or refresh current session
      responses:
        '204':
          description: Session refreshed
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logoutCurrentSession
      summary: Revoke current session and clear authentication cookie
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /users:
    get:
      tags: [Auth]
      operationId: listUsers
      summary: List users within the caller's approved scope
      x-permissions: [users.read]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: role
          in: query
          schema:
            type: string
            enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
        - name: status
          in: query
          schema: { type: string, enum: [active, archived, suspended] }
        - name: schoolId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Scoped user page without OIDC subject identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUserPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Auth]
      operationId: createUser
      summary: Create a scoped operational user or explicitly link a student record
      x-permissions: [users.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateManagedUser'
      responses:
        '201':
          description: Created scoped user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /users/summary:
    get:
      tags: [Auth]
      operationId: getUserSummary
      summary: Count users within the caller's management scope
      x-permissions: [users.manage]
      responses:
        '200':
          description: Scoped user totals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    patch:
      tags: [Auth]
      operationId: updateUser
      summary: Update a user within the caller's management scope
      x-permissions: [users.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateManagedUser'
      responses:
        '200':
          description: Updated scoped user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedUser'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Auth]
      operationId: archiveUser
      summary: Archive a user within the caller's management scope
      x-permissions: [users.manage]
      responses:
        '204':
          description: User archived
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /public/invitations/exchange:
    post:
      tags: [Auth]
      operationId: exchangeInvitation
      summary: Exchange a signed invitation token for a scoped evaluator session
      description: Invitation lifetime and additional verification method are TBD.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationExchangeRequest'
      responses:
        '200':
          description: Evaluator session established
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationSession'
        '401':
          $ref: '#/components/responses/InvitationInvalid'
        '422':
          $ref: '#/components/responses/ValidationError'
  /public/evaluations/verify-pin:
    post:
      tags: [Auth]
      operationId: verifyEvaluationPin
      summary: Exchange a random 16-character PIN for a scoped evaluator session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [pin]
              properties:
                pin:
                  type: string
                  minLength: 16
                  maxLength: 19
      responses:
        '200':
          description: Evaluator session established in HttpOnly cookies
          content:
            application/json:
              schema:
                type: object
                required: [actor, assignmentId]
                properties:
                  actor:
                    $ref: '#/components/schemas/Actor'
                  assignmentId:
                    $ref: '#/components/schemas/ObjectId'
        '401':
          $ref: '#/components/responses/InvitationInvalid'
        '429':
          description: Too many verification attempts
        '422':
          $ref: '#/components/responses/ValidationError'

  /academic/schools:
    get:
      tags: [Academic]
      operationId: listSchools
      summary: List Schools within caller scope
      x-permissions: [academic.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 25
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Archived'
      responses:
        '200':
          description: Paginated Schools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchoolList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Academic]
      operationId: createSchool
      summary: Create a School
      x-permissions: [academic.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolInput'
      responses:
        '201':
          description: School created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /academic/schools/{schoolId}:
    parameters:
      - $ref: '#/components/parameters/SchoolId'
    patch:
      tags: [Academic]
      operationId: updateSchool
      summary: Update an active School
      x-permissions: [academic.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchoolPatch'
      responses:
        '200':
          description: School updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/School'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /academic/programs:
    get:
      tags: [Academic]
      operationId: listPrograms
      summary: List Programs within caller scope
      x-permissions: [academic.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: schoolId
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Paginated Programs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Academic]
      operationId: createProgram
      summary: Create a Program
      x-permissions: [academic.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramInput'
      responses:
        '201':
          description: Program created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Program'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /academic/courses:
    get:
      tags: [Academic]
      operationId: listCourses
      summary: List Courses within caller scope
      x-permissions: [academic.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: programId
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Paginated Courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Academic]
      operationId: createCourse
      summary: Create a Course
      x-permissions: [academic.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /academic/terms:
    get:
      tags: [Academic]
      operationId: listAcademicTerms
      summary: List academic terms
      x-permissions: [academic.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: academicYear
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated terms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTermList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Academic]
      operationId: createAcademicTerm
      summary: Create an academic term
      x-permissions: [academic.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicTermInput'
      responses:
        '201':
          description: Academic term created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicTerm'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /academic/programs/{programId}:
    parameters:
      - { name: programId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Academic]
      operationId: updateProgram
      summary: Update a Program
      x-permissions: [academic.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Program updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /academic/courses/{courseId}:
    parameters:
      - { name: courseId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Academic]
      operationId: updateCourse
      summary: Update a Course
      x-permissions: [academic.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Course updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /academic/terms/{termId}:
    parameters:
      - { name: termId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Academic]
      operationId: updateAcademicTerm
      summary: Update an academic term
      x-permissions: [academic.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Academic term updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /students:
    get:
      tags: [Students]
      operationId: listStudents
      summary: List Students within effective scope
      x-permissions: [students.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: schoolId
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: programId
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
        - name: studentId
          in: query
          schema:
            type: string
        - name: evaluationStatus
          in: query
          schema:
            type: string
            enum: [awaiting_evaluator, awaiting_response, submitted, email_error]
      responses:
        '200':
          description: Paginated Students
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Students]
      operationId: createStudent
      summary: Create a Student
      x-permissions: [students.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentInput'
      responses:
        '201':
          description: Student created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /students/import-preview:
    post:
      tags: [Students]
      operationId: previewStudentImport
      summary: Validate a student workbook without writing student records
      x-permissions: [students.import]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Import preview batch created; valid rows are not committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentImportPreview'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Workbook exceeds the 5 MiB upload or row limit
        '422':
          $ref: '#/components/responses/ValidationError'
  /students/imports/{batchId}:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
    get:
      tags: [Students]
      operationId: getStudentImportPreview
      summary: Read an unexpired import preview owned by the caller
      x-permissions: [students.import]
      responses:
        '200':
          description: Current row decisions and commit outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentImportPreview'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /students/imports/{batchId}/commit:
    parameters:
      - name: batchId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/ObjectId'
    post:
      tags: [Students]
      operationId: commitStudentImport
      summary: Commit up to 100 explicitly confirmed rows atomically per row
      x-permissions: [students.import]
      parameters:
        - name: idempotency-key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentImportCommitInput'
      responses:
        '200':
          description: Committed rows; retry with the same key and payload is safe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentImportCommit'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Students]
      operationId: getStudent
      summary: Get a Student within effective scope
      x-permissions: [students.read]
      responses:
        '200':
          description: Student
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Students]
      operationId: updateStudent
      summary: Update a Student within effective scope
      x-permissions: [students.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentPatch'
      responses:
        '200':
          description: Student updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Students]
      operationId: archiveStudent
      summary: Archive a Student without deleting history
      x-permissions: [students.manage]
      responses:
        '204':
          description: Student archived
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /organizations:
    get:
      tags: [Internship]
      operationId: listOrganizations
      summary: List internship organizations
      x-permissions: [organizations.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Archived'
      responses:
        '200':
          description: Paginated Organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Internship]
      operationId: createOrganization
      summary: Create an internship Organization
      x-permissions: [organizations.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '422':
          $ref: '#/components/responses/ValidationError'
  /evaluators:
    get:
      tags: [Internship]
      operationId: listEvaluators
      summary: List external evaluators/advisers
      x-permissions: [organizations.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: organizationId
          in: query
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Paginated Evaluators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Internship]
      operationId: createEvaluator
      summary: Create an external Evaluator
      x-permissions: [organizations.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluatorInput'
      responses:
        '201':
          description: Evaluator created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluator'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /placements:
    get:
      tags: [Internship]
      operationId: listPlacements
      summary: List Placements within effective scope
      x-permissions: [placements.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: studentId
