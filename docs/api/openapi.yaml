      tags: [Reports]
      operationId: createReportExport
      summary: Request a scoped asynchronous CSV export
      x-permissions: [exports.create]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportExportRequest'
      responses:
        '202':
          description: Export accepted for asynchronous generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Invalid export selection or row limit exceeded
  /reports/exports/{exportId}:
    get:
      tags: [Reports]
      operationId: getReportExport
      summary: Get status of an owned report export
      x-permissions: [exports.download]
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Export metadata and current status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/exports/{exportId}/download-url:
    get:
      tags: [Reports]
      operationId: createReportExportDownloadUrl
      summary: Issue a short-lived private download URL for an owned export
      x-permissions: [exports.download]
      parameters:
        - name: exportId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ObjectId'
      responses:
        '200':
          description: Short-lived signed object-storage URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportDownload'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /audit-logs:
    get:
      tags: [Audit]
      operationId: listAuditLogs
      summary: List immutable audit events in approved scope
      x-permissions: [audit.read]
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: actorId
          in: query
          schema:
            type: string
          description: Applied only to System Administrator queries; ignored for other roles.
        - name: requestId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated audit events limited to the caller's own records and authorized resource scopes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: its_session
      description: Secure httpOnly same-site internal session cookie
    evaluatorBearer:
      type: http
      scheme: bearer
      bearerFormat: scoped-invitation-session
      description: Short-lived evaluator session bound to one assignment
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Archived:
      name: archived
      in: query
      description: Set true to include archived records; false excludes them. Omission preserves the endpoint's default.
      schema:
        type: boolean
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    SchoolId:
      name: schoolId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
    CompetencySetId:
      name: competencySetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    CycleId:
      name: cycleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
  responses:
    Unauthenticated:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTHENTICATION_REQUIRED
            message: Authentication is required.
            requestId: req_example
    InvitationInvalid:
      description: Invitation is invalid, expired, or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVITATION_INVALID
            message: This invitation cannot be used.
            requestId: req_example
    Forbidden:
      description: Authenticated caller lacks action or scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: PERMISSION_DENIED
            message: You do not have permission to perform this action.
            requestId: req_example
    NotFound:
      description: Resource does not exist or is concealed from caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
            message: Resource not found.
            requestId: req_example
    Conflict:
      description: Duplicate, stale version, idempotency conflict, or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request or publish validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: One or more fields are invalid.
            details:
              - field: email
                reason: invalid_format
            requestId: req_example
    PayloadTooLarge:
      description: Upload exceeds the maximum document asset size
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Private asset storage is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: PDF generation quotas for the authenticated actor or client IP are exhausted
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimiterUnavailable:
      description: Shared rate-limit storage is unavailable; generation fails closed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 507f1f77bcf86cd799439011
    HealthStatus:
      type: object
      required: [service, status, timestamp, version]
      properties:
        service:
          type: string
          enum: [api, web, worker]
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
    ReadinessStatus:
      type: object
      required: [ready, dependencies, timestamp]
      properties:
        ready:
          type: boolean
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
    ErrorDetail:
      type: object
      required: [reason]
      properties:
        field:
          type: string
        reason:
          type: string
        message:
          type: string
    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    LocalizedText:
      type: object
      required: [th, en]
      properties:
        th:
          type: string
          maxLength: 500
        en:
          type: string
          maxLength: 500
    CurrentSession:
      type: object
      required: [actor]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
    Actor:
      type: object
      required: [id, email, displayName, roles, scope]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
        scope:
          type: object
          required: [tenant, schoolIds, programIds]
          properties:
            tenant: { type: boolean }
            schoolIds:
              type: array
              items: { type: string }
            programIds:
              type: array
              items: { type: string }
            studentId: { type: string }
            assignmentId: { type: string }
        roleScopes:
          type: array
          items:
            type: object
            required: [role, tenant, schoolIds, programIds]
            properties:
              role:
                type: string
                enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
              tenant: { type: boolean }
              schoolIds:
                type: array
                items: { type: string }
              programIds:
                type: array
                items: { type: string }
    ManagedUser:
      type: object
      required: [id, email, displayName, status, roleAssignments, oidcLinked]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [active, archived, suspended] }
        oidcLinked:
          type: boolean
          description: Whether an issuer-bound OIDC subject is linked; no subject or issuer is exposed.
        studentId: { type: string }
        roleAssignments:
          type: array
          items:
            type: object
            required: [role, tenant, schoolIds, programIds, active]
            properties:
              role:
                type: string
                enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
              tenant: { type: boolean }
              schoolIds:
                type: array
                items: { type: string }
              programIds:
                type: array
                items: { type: string }
              active: { type: boolean }
    OidcAccountLinkRequest:
      type: object
      additionalProperties: false
      required: [subject, reason]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
          description: Exact, case-sensitive OIDC sub claim; leading/trailing whitespace is rejected.
        reason: { type: string, minLength: 10, maxLength: 1000 }
    OidcAccountLinkResponse:
      type: object
      additionalProperties: false
      required: [userId, issuer, status]
      properties:
        userId: { type: string }
        issuer: { type: string, format: uri }
        status: { type: string, enum: [linked] }
    ManagedUserPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedUser'
        meta:
          type: object
          required: [page, pageSize, total, totalPages]
          properties:
            page: { type: integer, minimum: 1 }
            pageSize: { type: integer, minimum: 1 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    UserSummary:
      type: object
      required: [total, systemAdmin, internshipStaff, coordinator, student]
      properties:
        total: { type: integer, minimum: 0 }
        systemAdmin: { type: integer, minimum: 0 }
        internshipStaff: { type: integer, minimum: 0 }
        coordinator: { type: integer, minimum: 0 }
        student: { type: integer, minimum: 0 }
    CreateManagedUser:
      type: object
      required: [email, displayName, role]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role:
          type: string
          enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
        status: { type: string, enum: [active, archived, suspended] }
        studentId: { type: string, maxLength: 50 }
        schoolIds:
          type: array
          items: { type: string }
        programIds:
          type: array
          items: { type: string }
    UpdateManagedUser:
      type: object
      minProperties: 1
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role:
          type: string
          enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
        status: { type: string, enum: [active, archived, suspended] }
        studentId: { type: string, maxLength: 50 }
        schoolIds:
          type: array
          items: { type: string }
        programIds:
          type: array
          items: { type: string }
    InvitationExchangeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 2048
        verificationCode:
          type: string
          minLength: 4
          maxLength: 12
          description: Optional until evaluator verification policy is approved
    InvitationSession:
      type: object
      required: [actor]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'

    SchoolInput:
