components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: its_session
      description: Secure httpOnly same-site internal session cookie
    evaluatorBearer:
      type: http
      scheme: bearer
      bearerFormat: scoped-invitation-session
      description: Short-lived evaluator session bound to one assignment
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Archived:
      name: archived
      in: query
      schema:
        type: boolean
        default: false
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    SchoolId:
      name: schoolId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
    CompetencySetId:
      name: competencySetId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    CycleId:
      name: cycleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
  responses:
    Unauthenticated:
      description: Authentication is missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AUTHENTICATION_REQUIRED
            message: Authentication is required.
            requestId: req_example
    InvitationInvalid:
      description: Invitation is invalid, expired, or revoked
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVITATION_INVALID
            message: This invitation cannot be used.
            requestId: req_example
    Forbidden:
      description: Authenticated caller lacks action or scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: PERMISSION_DENIED
            message: You do not have permission to perform this action.
            requestId: req_example
    NotFound:
      description: Resource does not exist or is concealed from caller
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
            message: Resource not found.
            requestId: req_example
    Conflict:
      description: Duplicate, stale version, idempotency conflict, or invalid state transition
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request or publish validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: One or more fields are invalid.
            details:
              - field: email
                reason: invalid_format
            requestId: req_example
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 507f1f77bcf86cd799439011
    HealthStatus:
      type: object
      required: [service, status, timestamp, version]
      properties:
        service:
          type: string
          enum: [api, web, worker]
        status:
          type: string
          enum: [ok]
        timestamp:
          type: string
          format: date-time
        version:
          type: string
    ReadinessStatus:
      type: object
      required: [ready, dependencies, timestamp]
      properties:
        ready:
          type: boolean
        dependencies:
          type: object
          additionalProperties:
            type: string
            enum: [ok, unavailable]
        timestamp:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
    ErrorDetail:
      type: object
      required: [reason]
      properties:
        field:
          type: string
        reason:
          type: string
        message:
          type: string
    PageMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    LocalizedText:
      type: object
      required: [th, en]
      properties:
        th:
          type: string
          maxLength: 500
        en:
          type: string
          maxLength: 500
    CurrentSession:
      type: object
      required: [actor]
      properties:
        actor:
          $ref: '#/components/schemas/Actor'
    Actor:
      type: object
      required: [id, email, displayName, roles, scope]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
        scope:
          type: object
          required: [tenant, schoolIds, programIds]
          properties:
            tenant: { type: boolean }
            schoolIds:
              type: array
              items: { type: string }
            programIds:
              type: array
              items: { type: string }
            studentId: { type: string }
            assignmentId: { type: string }
        roleScopes:
          type: array
          items:
            type: object
            required: [role, tenant, schoolIds, programIds]
            properties:
              role:
                type: string
                enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
              tenant: { type: boolean }
              schoolIds:
                type: array
                items: { type: string }
              programIds:
                type: array
                items: { type: string }
    ManagedUser:
      type: object
      required: [id, email, displayName, status, roleAssignments]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        status: { type: string, enum: [active, archived, suspended] }
        studentId: { type: string }
        roleAssignments:
          type: array
          items:
            type: object
            required: [role, tenant, schoolIds, programIds, active]
            properties:
              role:
                type: string
                enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
              tenant: { type: boolean }
              schoolIds:
                type: array
                items: { type: string }
              programIds:
                type: array
                items: { type: string }
              active: { type: boolean }
    ManagedUserPage:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedUser'
        meta:
          type: object
          required: [page, pageSize, total, totalPages]
          properties:
            page: { type: integer, minimum: 1 }
            pageSize: { type: integer, minimum: 1 }
            total: { type: integer, minimum: 0 }
            totalPages: { type: integer, minimum: 0 }
    UserSummary:
      type: object
      required: [total, systemAdmin, internshipStaff, coordinator, student]
      properties:
        total: { type: integer, minimum: 0 }
        systemAdmin: { type: integer, minimum: 0 }
        internshipStaff: { type: integer, minimum: 0 }
        coordinator: { type: integer, minimum: 0 }
        student: { type: integer, minimum: 0 }
    CreateManagedUser:
      type: object
      required: [email, displayName, role]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        role:
          type: string
          enum: [systemAdmin, internshipStaff, coordinator, student, evaluator, auditor]
        status: { type: string, enum: [active, archived, suspended] }
        studentId: { type: string, maxLength: 50 }
        schoolIds:
          type: array
          items: { type: string }
        programIds:
          type: array
          items: { type: string }
    UpdateManagedUser:
