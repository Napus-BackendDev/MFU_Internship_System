    SmtpSettingsSource:
      type: string
      enum: [database, environment]
    SmtpSettings:
      type: object
      required:
        - enabled
        - source
        - host
        - port
        - secure
        - username
        - from
        - passwordConfigured
        - effectivePasswordConfigured
        - version
        - updatedAt
        - updatedBy
      properties:
        enabled:
          type: boolean
          description: Whether the encrypted database override is active
        source:
          $ref: '#/components/schemas/SmtpSettingsSource'
        host:
          type: string
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        secure:
          type: boolean
          description: Use TLS from connection start, commonly port 465
        username:
          type: string
          maxLength: 320
        from:
          type: string
          maxLength: 320
        passwordConfigured:
          type: boolean
          description: Whether the database override contains an encrypted password
        effectivePasswordConfigured:
          type: boolean
          description: Whether the active source has a password without revealing it
        version:
          type: integer
          minimum: 0
        updatedAt:
          type: [string, 'null']
          format: date-time
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
    SmtpSettingsUpdate:
      type: object
      additionalProperties: false
      required: [enabled, host, port, secure, username, from, version]
      properties:
        enabled:
          type: boolean
        host:
          type: string
          minLength: 1
          maxLength: 253
          pattern: '^[a-zA-Z0-9.-]+$'
        port:
          type: integer
          minimum: 1
          maximum: 65535
        secure:
          type: boolean
        username:
          type: string
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
          description: Omit to preserve the existing encrypted password
        clearPassword:
          type: boolean
          default: false
          description: Remove the stored password; cannot be combined with password
        from:
          type: string
          minLength: 3
          maxLength: 320
        version:
          type: integer
          minimum: 0
    SmtpTestRequest:
      type: object
      additionalProperties: false
      required: [recipientEmail]
      properties:
        recipientEmail:
          type: string
          format: email
          maxLength: 320
    SmtpTestDelivery:
      type: object
      required:
        - id
        - status
        - configurationSource
        - configurationVersion
        - failureCode
        - createdAt
        - completedAt
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        status:
          type: string
          enum: [queued, sending, sent, failed]
        configurationSource:
          $ref: '#/components/schemas/SmtpSettingsSource'
        configurationVersion:
          type: integer
          minimum: 0
        failureCode:
          type: [string, 'null']
        createdAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time

